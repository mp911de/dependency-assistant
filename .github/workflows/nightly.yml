name: "[CI] 🌗💤 Nightly"
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Check for changes since the last run
    runs-on: ubuntu-latest
    outputs:
      verify: ${{ steps.check.outputs.verify }}
    steps:

      - name: Compare with the last successful run
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_sha="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow nightly.yml \
              --branch "$GITHUB_REF_NAME" \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // empty'
          )"

          if [[ "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "No commits since the last successful run at $last_sha; skipping"
            echo "verify=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last successful run: ${last_sha:-none}, current: $GITHUB_SHA"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify plugin against recommended IDEs
    needs: changes
    if: ${{ needs.changes.outputs.verify == 'true' }}
    runs-on: ubuntu-latest
    steps:

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Fetch sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Verify plugin
        run: >
          ./gradlew verifyPlugin
          -Porg.jetbrains.intellij.platform.downloadSources=false

      - name: Capture verifier reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: 'build/reports/*'
          retention-days: 15
